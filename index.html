.meta{font-size:.85rem;color:var(--mut);margin-bottom:8px}.ben{font-size:.85rem;color:var(--g);font-weight:500;margin-bottom:14px}

.ico{font-size:2rem;margin-bottom:10px}.step{counter-increment:st;position:relative;padding:26px}

.steps{counter-reset:st}
.filters{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:28px}
label{font-size:.78rem;font-weight:700;color:var(--mut);display:block;margin-bottom:4px}

.pg{padding:56px 0 24px}.fm{display:grid;gap:14px;grid-template-columns:1fr 1fr}.fm .f{grid-column:1/-1}
.ok{display:none;background:var(--g);color:var(--on);border-radius:16px;padding:18px;margin-top:16px}

.fl{display:flex;flex-wrap:wrap;gap:18px;margin:18px 0}.fl a:hover{color:#f2c98a}

.art:before,.art:after{display:none}.art svg{position:absolute;inset:0;width:100%;height:100%;transition:.6s}.card:hover .art svg{transform:scale(1.08)}
.art span{position:absolute;top:12px;left:12px;font-size:1.3rem;line-height:1;background:rgba(255,255,255,.88);border-radius:99px;padding:7px 10px;animation:none;filter:none}.card:hover .art span{transform:none}.art{height:190px}
.pg-view{animation:in .5s ease}@keyframes in{from{opacity:0;transform:translateY(12px)}}
.rv{opacity:0;transform:translateY(20px);transition:.7s}.rv.v{opacity:1;transform:none}

<section class="s" style="padding-top:0"><div class="w"><h2>Explore Experiences</h2><div class="grid">${EXP.map((x,i)=>card(i,x[0],x[1],x[2],"Explore",x[3])).join("")}</div></div></section>
<section class="s" style="padding-top:0"><div class="w"><h2>Featured Destinations</h2><div class="grid">${DST.map((x,i)=>card(i+2,x[1],x[0],x[2],"Discover","destinations")).join("")}</div></div></section>
<section class="s" style="background:linear-gradient(135deg,rgba(255,182,39,.22),rgba(255,93,143,.16),rgba(19,181,201,.2))"><div class="w"><h2>Why DETOUR?</h2><div class="grid">${[["🌱","Travel Responsibly","Discover experiences designed to encourage lower-impact travel."],["🤝","Support Local","Help local guides, artisans, restaurants and small businesses benefit from tourism."],["✨","Authentic Experiences","Experience destinations through local culture rather than only famous tourist attractions."],["🗺️","Discover Hidden Places","Find lesser-known experiences beyond crowded tourist spots."]].map(x=>`<div class="card rv" style="padding:26px"><div class="ico">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join("")}</div></div></section>
<section class="s"><div class="w"><h2>How It Works</h2><div class="grid steps">${["Choose a destination","Explore local experiences","Book your experience","Travel responsibly & create memories"].map(t=>`<div class="card step rv"><h3>${t}</h3></div>`).join("")}</div></div></section>
<section class="s" style="padding-top:0"><div class="w"><h2>From Our Travel Journal</h2><div class="grid">${BLG.slice(0,3).map((x,i)=>card(i+1,x[3],x[0],x[2],"Read More","blog")).join("")}</div></div></section>
<section class="s" style="padding-top:0"><div class="w"><div class="cta rv"><h2>Your next adventure can make a difference.</h2><p>Explore local. Support communities. Leave a lighter footprint.</p>${btn("Start Exploring","explore")}</div></div></section>`;
const explore=()=>{const u=k=>[...new Set(XP.map(x=>x[k]))];return `<div class="w pg-view"><div class="pg"><p class="eyebrow">Explore</p><h1 style="font-size:clamp(2rem,5vw,3.2rem)">Experiences hosted by locals</h1><p>Filter by where, what, how much and how long. Prices are approximate per person.</p></div>
<div class="filters">${[["fd","Destination",u(1)],["ft","Experience type",u(2)]].map(f=>`<div><label for="${f[0]}">${f[1]}</label><select id="${f[0]}"><option value="">All</option>${f[2].map(o=>`<option>${o}</option>`).join("")}</select></div>`).join("")}<div><label for="fb">Budget</label><select id="fb"><option value="">Any</option><option value="low">Under ₹1,000</option><option value="mid">₹1,000 – ₹3,000</option><option value="high">₹3,000+</option></select></div><div><label for="fu">Duration</label><select id="fu"><option value="">Any</option><option value="s">Up to 3 hrs</option><option value="m">Half to full day</option><option value="l">Multi-day</option></select></div></div>
<div class="grid" id="xg"></div><p id="xn" style="display:none;text-align:center;padding:30px">No matches yet. Try widening your filters.</p><div style="height:60px"></div></div>`};
function xf(){const v=i=>$("#"+i).value,dur=d=>/day/.test(d)&&/2/.test(d)?"l":/Full/.test(d)?"m":"s";
const r=XP.filter(x=>(!v("fd")||x[1]==v("fd"))&&(!v("ft")||x[2]==v("ft"))&&(!v("fb")||x[3]==v("fb"))&&(!v("fu")||dur(x[4])==v("fu")));
$("#xg").innerHTML=r.map((x,i)=>`<article class="card rv v">${art(i,x[7])}<div class="b"><span class="tag">${x[2]}</span><h3>${x[0]}</h3><div class="meta">📍 ${x[1]} · ⏱ ${x[4]} · ~₹${x[5].toLocaleString("en-IN")}</div><div class="ben">🌱 ${x[6]}</div><a class="btn sm" href="#/contact" onclick="tr('view_experience','${x[0]}')">View Experience</a></div></article>`).join("");
$("#xn").style.display=r.length?"none":"block";tr("filter","explore")}
const dests=()=>`<div class="w pg-view"><div class="pg"><p class="eyebrow">Destinations</p><h1 style="font-size:clamp(2rem,5vw,3.2rem)">Five places, a hundred small stories</h1></div>${DST.map((x,i)=>`<article class="card dest rv" id="d-${x[0]}">${art(i+2,x[1])}<div class="b"><h2>${x[0]}</h2><p>${x[2]}</p><p><b>Try:</b> ${x[3]}.</p><p><b>Best time:</b> ${x[4]}</p><a class="btn sm" href="#/explore" onclick="tr('discover','${x[0]}')">See ${x[0]} experiences</a></div></article>`).join("")}</div>`;
const SUS=[["What is sustainable travel?","Travelling in a way that respects places and people: lower impact on the environment, fair benefit for local communities, and respect for local culture. It's about making better choices, not perfect ones."],["How travellers can reduce waste","Carry a refillable bottle, cloth bag and cutlery. Say no to single-use plastics, refill at filter points and pack out what you pack in."],["Choosing local businesses","Eat at family-run eateries, hire local guides and buy crafts directly from makers. More of your money stays in the community."],["Responsible interaction with nature","Stay on marked trails, keep distance from wildlife, never feed animals, and avoid picking plants or leaving fires unattended."],["Supporting local communities","Ask before photographing people, dress modestly at religious sites, learn a few local words and pay fair prices without over-bargaining."],["Sustainable transport","Prefer trains and buses, share cabs, walk or cycle short distances, and stay longer in fewer places to cut down on travel."]];
const CHK=["Carry a reusable bottle and bag","Book locally owned stays or guides","Use trains, buses or shared rides","Stay on trails and respect wildlife","Ask before photographing people","Buy directly from artisans","Leave no trash behind"];
const sus=()=>`<div class="w pg-view"><div class="pg"><p class="eyebrow">Sustainable Travel</p><h1 style="font-size:clamp(2rem,5vw,3.2rem)">Travel lighter, in simple steps</h1><p>A plain-language guide for first-time and seasoned travellers.</p></div>${SUS.map(x=>`<div class="sec rv"><h3>${x[0]}</h3><p style="margin:0">${x[1]}</p></div>`).join("")}<div class="sec chk"><h3>Responsible travel checklist</h3>${CHK.map((c,i)=>`<label><input type="checkbox" onchange="tr('checklist','${i}')"> ${c}</label>`).join("")}</div><div style="height:50px"></div></div>`;
const blog=()=>`<div class="w pg-view"><div class="pg"><p class="eyebrow">Travel Journal</p><h1 style="font-size:clamp(2rem,5vw,3.2rem)">Stories from the slow lane</h1></div><div class="chips">${["All","Sustainable Travel","Local Food","Culture","Nature","Travel Tips"].map((c,i)=>`<button class="chip ${i?"":"on"}" onclick="bf(this,'${c}')">${c}</button>`).join("")}</div><div class="grid" id="bg"></div><div style="height:60px"></div></div>`;
function bf(el,c){document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));if(el)el.classList.add("on");
$("#bg").innerHTML=BLG.filter(x=>c=="All"||x[1]==c).map((x,i)=>`<article class="card rv v">${art(i,x[3])}<div class="b"><span class="tag">${x[1]}</span><h3>${x[0]}</h3><p>${x[2]}</p><a class="btn sm" href="#/blog" onclick="tr('read_more','${x[0]}');return false">Read More</a></div></article>`).join("")||"<p>No posts in this category yet.</p>";tr("blog_filter",c)}
const about=()=>`<div class="w pg-view"><div class="pg"><p class="eyebrow">About</p><h1 style="font-size:clamp(2rem,5vw,3.2rem)">Travel that means something</h1></div><div class="panel rv"><h2>Our mission</h2><p style="font-size:1.3rem;font-family:Fraunces,Georgia,serif">“To make travel more meaningful by connecting travellers with local communities and responsible experiences.”</p></div><div class="grid" style="margin-top:22px">${[["🌱","Lower impact","We highlight slower, lighter ways to explore."],["🤝","Fair to locals","We favour hosts who are from the places they show you."],["🔍","Honest","We share what hosts tell us and don't claim official sustainability certification."]].map(x=>`<div class="card rv" style="padding:26px"><div class="ico">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join("")}</div><div style="height:30px"></div>${btn("Get in touch","contact")}<div style="height:60px"></div></div>`;
const contact=()=>`<div class="w pg-view" style="max-width:760px"><div class="pg"><p class="eyebrow">Contact & Booking</p><h1 style="font-size:clamp(2rem,5vw,3.2rem)">Plan your trip with us</h1><p>Tell us what you have in mind. We'll reply with suggestions and availability.</p></div>
<form class="sec fm" onsubmit="return sendEnq(event)"><div><label for="n">Name</label><input id="n" required></div><div><label for="e">Email</label><input id="e" type="email" required></div>
<div><label for="d">Destination</label><select id="d">${DST.map(x=>`<option>${x[0]}</option>`).join("")}</select></div><div><label for="x">Preferred experience</label><select id="x">${EXP.map(x=>`<option>${x[1]}</option>`).join("")}</select></div>
<div><label for="t">Number of travellers</label><input id="t" type="number" min="1" value="2"></div><div><label for="dt">Preferred date</label><input id="dt" type="date"></div>
<div class="f"><label for="m">Message</label><textarea id="m" rows="4"></textarea></div><div class="f"><button class="btn" type="submit">Send Enquiry</button></div></form><div class="ok" id="ok" role="status">Thank you! Your enquiry is ready. A DETOUR host will get back to you soon.</div><div style="height:60px"></div></div>`;
function sendEnq(ev){ev.preventDefault();tr("generate_lead","enquiry",{destination:$("#d").value,experience:$("#x").value});$("#ok").style.display="block";ev.target.reset();return false}
const R={home,explore,destinations:dests,sustainable:sus,blog,about,contact};
function route(){const p=(location.hash.replace("#/","")||"home");const k=R[p]?p:"home";$("#app").innerHTML=R[k]();
document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.p==k));$("nav").classList.remove("open");
document.title=(k=="home"?"":P.concat([["contact","Contact"]]).find(x=>x[0]==k)[1]+" | ")+"DETOUR – Discover local. Travel responsibly.";
if(k=="explore"){document.querySelectorAll("select").forEach(s=>s.onchange=xf);xf()}if(k=="blog")bf(null,"All");
window.scrollTo(0,0);dataLayer.push({event:"page_view",page_path:"/"+k,page_title:document.title});if(window.gtag)gtag("event","page_view",{page_path:"/"+k});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("v");io.unobserve(e.target)}}),{threshold:.1});document.querySelectorAll(".rv:not(.v)").forEach(el=>io.observe(el))}
addEventListener("hashchange",route);route();
</script>
</body>
</html>
